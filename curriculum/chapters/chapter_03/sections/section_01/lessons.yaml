  expected_result: 'Dawn_basis_day1: -0.45'
  professional_application: Compare Henry Hub with Waha, AECO, Dawn, Algonquin Citygate, and other regional pricing locations.
  product_implication: Basis, curves and position views are the core screens of a gas trading product; every number must trace to a price source.
  before: L03.01.2
  after: L03.01.4
  status: written_command_verified
- id: L03.01.4
  title: Prompt month and price reporting
  objective: Explain prompt month and price reporting and show it in the EX-019 output.
  prerequisites:
  - L03.01.3
  market_lesson: The prompt month is the nearest contract; published prices come from exchanges and price reporting agencies. [K]
