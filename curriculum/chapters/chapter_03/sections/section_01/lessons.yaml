section: '3.1'
title: Henry Hub and benchmark pricing
exercise: EX-019
lessons:
- id: L03.01.1
  title: Henry Hub as benchmark
  objective: Explain henry Hub as benchmark and show it in the EX-019 output.
  prerequisites:
  - L02.10.5
  market_lesson: Henry Hub in Louisiana is the delivery point of the main US gas futures contract and the pricing reference for most deals. [K]
  north_american_example: 'EX-019 (Calculate Regional Gas Basis) on synthetic North American data: Waha_basis_day1 = -2.15 [EX]'
  terminal_activity: python3 emi.py run 019 | grep '^Waha_basis_day1:'
  expected_result: 'Waha_basis_day1: -2.15'
  professional_application: Compare Henry Hub with Waha, AECO, Dawn, Algonquin Citygate, and other regional pricing locations.
  product_implication: Basis, curves and position views are the core screens of a gas trading product; every number must trace to a price source.
  before: L02.10.5
  after: L03.01.2
  status: written_command_verified
- id: L03.01.2
  title: NYMEX NG contract specification
  objective: Explain nYMEX NG contract specification and show it in the EX-019 output.
  prerequisites:
  - L03.01.1
  market_lesson: The contract is a standard monthly volume in MMBtu for physical delivery at the hub. [K]
  north_american_example: 'EX-019 (Calculate Regional Gas Basis) on synthetic North American data: AECO_basis_day1 = -1.1 [EX]'
  terminal_activity: python3 emi.py run 019 | grep '^AECO_basis_day1:'
  expected_result: 'AECO_basis_day1: -1.1'
  professional_application: Compare Henry Hub with Waha, AECO, Dawn, Algonquin Citygate, and other regional pricing locations.
  product_implication: Basis, curves and position views are the core screens of a gas trading product; every number must trace to a price source.
  before: L03.01.1
  after: L03.01.3
  status: written_command_verified
- id: L03.01.3
  title: Settlement and expiry mechanics
  objective: Explain settlement and expiry mechanics and show it in the EX-019 output.
  prerequisites:
  - L03.01.2
  market_lesson: Trading in a month ends shortly before delivery; the final settlement price is widely used in indices. [K]
