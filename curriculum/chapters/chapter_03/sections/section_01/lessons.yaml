- id: L03.01.5
  title: Benchmark limits as a regional proxy
  objective: Explain benchmark limits as a regional proxy and show it in the EX-019 output.
  prerequisites:
  - L03.01.4
  market_lesson: Henry Hub does not tell you the price in a constrained region; that is what basis measures. [K]
  north_american_example: 'EX-019 (Calculate Regional Gas Basis) on synthetic North American data: Henry_Hub_basis_day1 = 0 [EX]'
  terminal_activity: python3 emi.py run 019 | grep '^Henry_Hub_basis_day1:'
  expected_result: 'Henry_Hub_basis_day1: 0'
  professional_application: Compare Henry Hub with Waha, AECO, Dawn, Algonquin Citygate, and other regional pricing locations.
  product_implication: Basis, curves and position views are the core screens of a gas trading product; every number must trace to a price source.
  before: L03.01.4
  after: L03.02.1
