section: '3.8'
title: LNG feed-gas demand and international price relationships
exercise: EX-033
lessons:
- id: L03.08.1
  title: Feed-gas demand drivers
  objective: Explain feed-gas demand drivers and show it in the EX-033 output.
  prerequisites:
  - L03.07.5
  market_lesson: LNG feed gas demand depends on terminal capacity, utilisation and global spreads. [K]
  north_american_example: 'EX-033 (Calculate LNG Export Netbacks) on synthetic North American data: fob_cost_USD_per_MMBtu = 6.2375 [EX]'
  terminal_activity: python3 emi.py run 033 | grep '^fob_cost_USD_per_MMBtu:'
  expected_result: 'fob_cost_USD_per_MMBtu: 6.2375'
  professional_application: Compare Henry Hub costs with international LNG selling prices after liquefaction, shipping, and regasification costs.
  product_implication: Basis, curves and position views are the core screens of a gas trading product; every number must trace to a price source.
  before: L03.07.5
  after: L03.08.2
  status: written_command_verified
