section: '3.6'
title: Transportation and basis contracts
exercise: EX-016
lessons:
- id: L03.06.1
  title: Transport contract as a spread option
  objective: Explain transport contract as a spread option and show it in the EX-016 output.
  prerequisites:
  - L03.05.5
  market_lesson: Firm transport lets you buy at one point and sell at another, so its value moves like an option on the spread. [K]
  north_american_example: 'EX-016 (Calculate Pipeline Transportation Economics) on synthetic North American data: breakeven_load_factor = 0.849057 [EX]'
  terminal_activity: python3 emi.py run 016 | grep '^breakeven_load_factor:'
  expected_result: 'breakeven_load_factor: 0.849057'
  professional_application: Compare firm and interruptible transportation costs under different market conditions.
  product_implication: Basis, curves and position views are the core screens of a gas trading product; every number must trace to a price source.
  before: L03.05.5
  after: L03.06.2
  status: written_command_verified
- id: L03.06.2
  title: Basis swaps
  objective: Explain basis swaps and show it in the EX-016 output.
  prerequisites:
  - L03.06.1
  market_lesson: A basis swap fixes the difference between a location and Henry Hub. [K]
  north_american_example: 'EX-016 (Calculate Pipeline Transportation Economics) on synthetic North American data: firm_unit_cost_at_100pct = 0.47 [EX]'
  terminal_activity: python3 emi.py run 016 | grep '^firm_unit_cost_at_100pct:'
  expected_result: 'firm_unit_cost_at_100pct: 0.47'
  professional_application: Compare firm and interruptible transportation costs under different market conditions.
  product_implication: Basis, curves and position views are the core screens of a gas trading product; every number must trace to a price source.
  before: L03.06.1
  after: L03.06.3
  status: written_command_verified
