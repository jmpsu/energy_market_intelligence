section: '3.9'
title: Natural gas position management and valuation
exercise: EX-027
lessons:
- id: L03.09.1
  title: Position aggregation by hub and tenor
  objective: Explain position aggregation by hub and tenor and show it in the EX-027 output.
  prerequisites:
  - L03.08.5
  market_lesson: Positions are summed by hub and delivery month to see net exposure. [K]
  north_american_example: 'EX-027 (Build a Regional Gas Trading Portfolio) on synthetic North American data: net_position_MMBtu = 40000 [EX]'
  terminal_activity: python3 emi.py run 027 | grep '^net_position_MMBtu:'
  expected_result: 'net_position_MMBtu: 40000'
  professional_application: Combine multiple hub positions and calculate aggregate exposure, basis risk, and P&L.
  product_implication: Basis, curves and position views are the core screens of a gas trading product; every number must trace to a price source.
  before: L03.08.5
  after: L03.09.2
  status: written_command_verified
