section: '1.7'
title: Bilateral and organized wholesale markets
exercise: EX-046
lessons:
- id: L01.07.1
  title: Bilateral contracting mechanics
  objective: Explain bilateral contracting mechanics and show it in the EX-046 output.
  prerequisites:
  - L01.06.5
  market_lesson: A bilateral deal is negotiated between two parties and needs transmission arranged separately in non-ISO regions. [K]
  north_american_example: 'EX-046 (Compare ISO/RTO and Bilateral Markets) on synthetic North American data: iso_spot_seller = 42 [EX]'
  terminal_activity: python3 emi.py run 046 | grep '^iso_spot_seller:'
  expected_result: 'iso_spot_seller: 42'
  professional_application: Model differences between centrally organized wholesale markets and bilateral electricity transactions.
  product_implication: A market-intelligence product needs one reference model of participants, locations and units before any analytics.
  before: L01.06.5
  after: L01.07.2
  status: written_command_verified
- id: L01.07.2
  title: Centrally cleared organized markets
  objective: Explain centrally cleared organized markets and show it in the EX-046 output.
  prerequisites:
  - L01.07.1
  market_lesson: Organized markets clear all bids and offers centrally and settle against published prices. [K]
  north_american_example: 'EX-046 (Compare ISO/RTO and Bilateral Markets) on synthetic North American data: bilateral_physical_with_wheeling_seller = 45 [EX]'
  terminal_activity: python3 emi.py run 046 | grep '^bilateral_physical_with_wheeling_seller:'
  expected_result: 'bilateral_physical_with_wheeling_seller: 45'
  professional_application: Model differences between centrally organized wholesale markets and bilateral electricity transactions.
  product_implication: A market-intelligence product needs one reference model of participants, locations and units before any analytics.
  before: L01.07.1
  after: L01.07.3
  status: written_command_verified
- id: L01.07.3
  title: OTC vs exchange execution
  objective: Explain oTC vs exchange execution and show it in the EX-046 output.
  prerequisites:
  - L01.07.2
  market_lesson: OTC trades are customised and carry counterparty credit risk; exchange trades are standard and cleared. [K]
  north_american_example: 'EX-046 (Compare ISO/RTO and Bilateral Markets) on synthetic North American data: iso_plus_cfd_at_gen_node_seller = 45 [EX]'
  terminal_activity: python3 emi.py run 046 | grep '^iso_plus_cfd_at_gen_node_seller:'
  expected_result: 'iso_plus_cfd_at_gen_node_seller: 45'
  professional_application: Model differences between centrally organized wholesale markets and bilateral electricity transactions.
  product_implication: A market-intelligence product needs one reference model of participants, locations and units before any analytics.
  before: L01.07.2
  after: L01.07.4
  status: written_command_verified
- id: L01.07.4
  title: Clearing, margin and credit support
  objective: Explain clearing, margin and credit support and show it in the EX-046 output.
  prerequisites:
  - L01.07.3
  market_lesson: 'Clearing replaces counterparty risk with margin: initial margin up front, variation margin daily. [K]'
