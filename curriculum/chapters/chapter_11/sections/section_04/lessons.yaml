section: '11.4'
title: Product vision and strategic positioning
exercise: EX-096
lessons:
- id: L11.04.1
  title: Vision statement
  objective: Explain vision statement and show it in the EX-096 output.
  prerequisites:
  - L11.03.5
  market_lesson: A vision statement says who the product serves and what changes for them. [K]
  north_american_example: 'EX-096 (Design a Market Intelligence Product) on synthetic North American data: requirements = 8 [EX]'
  terminal_activity: python3 emi.py run 096 | grep '^requirements:'
  expected_result: 'requirements: 8'
  professional_application: Create a product specification for an integrated gas and power analytics platform, including users, workflows, data requirements, and acceptance criteria.
  product_implication: Every roadmap item should cite customer evidence and a measurable KPI.
  before: L11.03.5
  after: L11.04.2
  status: written_command_verified
