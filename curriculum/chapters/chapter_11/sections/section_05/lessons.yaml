  title: Market sizing
  objective: Explain market sizing and show it in the EX-099 output.
  prerequisites:
  - L11.04.5
  market_lesson: Market sizing estimates total and reachable revenue. [K]
  north_american_example: 'EX-099 (Design an Energy Exemplar Product Integration) on synthetic North American data: components = 13 [EX]'
  terminal_activity: python3 emi.py run 099 | grep '^components:'
  expected_result: 'components: 13'
  professional_application: Develop a conceptual architecture connecting market data, simulation engines, analytical services, user workflows, and reporting. Distinguish verified product capabilities from proposed capabilities.
  product_implication: Every roadmap item should cite customer evidence and a measurable KPI.
  before: L11.04.5
  after: L11.05.2
  status: written_command_verified
