section: '11.6'
title: Roadmap design and prioritization
exercise: EX-097
lessons:
- id: L11.06.1
  title: Prioritization frameworks
  objective: Explain prioritization frameworks and show it in the EX-097 output.
  prerequisites:
  - L11.05.5
  market_lesson: Prioritisation frameworks score value against effort. [K]
  north_american_example: 'EX-097 (Prioritize a Product Roadmap) on synthetic North American data: rank_1 = Basis_monitor [EX]'
  terminal_activity: python3 emi.py run 097 | grep '^rank_1:'
  expected_result: 'rank_1: Basis_monitor'
  professional_application: Rank competing feature requests using customer value, commercial impact, technical feasibility, risk, and development effort.
  product_implication: Every roadmap item should cite customer evidence and a measurable KPI.
  before: L11.05.5
  after: L11.06.2
  status: written_command_verified
