lessons:
- id: L11.01.1
  title: Segment taxonomy
  objective: Explain segment taxonomy and show it in the EX-095 output.
  prerequisites:
  - L10.10.5
  market_lesson: 'Customers segment by what they do: utilities, IPPs, traders, developers, investors, consultants. [K]'
  north_american_example: 'EX-095 (Conduct Energy Market Customer Discovery) on synthetic North American data: rank_1 = Automated_basis_monitoring score=25000.0 [EX]'
  terminal_activity: python3 emi.py run 095 | grep '^rank_1:'
  expected_result: 'rank_1: Automated_basis_monitoring score=25000.0'
  professional_application: Translate trader, analyst, scheduler, and portfolio manager workflows into documented product requirements.
  product_implication: Every roadmap item should cite customer evidence and a measurable KPI.
  before: L10.10.5
  after: L11.01.2
  status: written_command_verified
