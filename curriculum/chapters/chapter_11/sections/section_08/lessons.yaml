section: '11.8'
title: Adoption, retention, revenue, and customer value
exercise: EX-098
lessons:
- id: L11.08.1
  title: Adoption metrics
  objective: Explain adoption metrics and show it in the EX-098 output.
  prerequisites:
  - L11.07.5
  market_lesson: Adoption metrics count active use. [K]
  north_american_example: 'EX-098 (Build Product Performance Metrics) on synthetic North American data: adoption_wau_pct_of_licensed = 46 [EX]'
  terminal_activity: python3 emi.py run 098 | grep '^adoption_wau_pct_of_licensed:'
  expected_result: 'adoption_wau_pct_of_licensed: 46'
  professional_application: Define KPIs for model accuracy, execution runtime, data quality, user adoption, customer retention, and commercial value.
  product_implication: Every roadmap item should cite customer evidence and a measurable KPI.
  before: L11.07.5
  after: L11.08.2
  status: written_command_verified
