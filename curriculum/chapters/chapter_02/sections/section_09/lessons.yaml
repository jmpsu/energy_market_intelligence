section: '2.9'
title: Balancing, linepack, OFOs, and operational notices
exercise: EX-029
lessons:
- id: L02.09.1
  title: Imbalances and tolerances
  objective: Explain imbalances and tolerances and show it in the EX-029 output.
  prerequisites:
  - L02.08.5
  market_lesson: An imbalance is the gap between what a shipper scheduled and what actually flowed. [K]
  north_american_example: 'EX-029 (Model Pipeline Imbalances) on synthetic North American data: Alpha_imbalance_pct = 1.5 [EX]'
  terminal_activity: python3 emi.py run 029 | grep '^Alpha_imbalance_pct:'
  expected_result: 'Alpha_imbalance_pct: 1.5'
  professional_application: Calculate the difference between nominated, confirmed, scheduled, and actual gas deliveries.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.08.5
  after: L02.09.2
  status: written_command_verified
- id: L02.09.2
  title: Linepack as short-term buffer
  objective: Explain linepack as short-term buffer and show it in the EX-029 output.
  prerequisites:
  - L02.09.1
  market_lesson: Linepack, the gas held in the pipe, absorbs small short-term mismatches. [K]
  north_american_example: 'EX-029 (Model Pipeline Imbalances) on synthetic North American data: Beta_imbalance_pct = -5 [EX]'
  terminal_activity: python3 emi.py run 029 | grep '^Beta_imbalance_pct:'
  expected_result: 'Beta_imbalance_pct: -5'
  professional_application: Calculate the difference between nominated, confirmed, scheduled, and actual gas deliveries.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.09.1
  after: L02.09.3
  status: written_command_verified
