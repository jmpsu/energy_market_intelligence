  professional_application: Build a simplified nomination schedule showing requested quantities, pipeline confirmations, and scheduled volumes.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.08.2
  after: L02.08.4
  status: written_command_verified
