- id: L02.02.5
  title: Processing contract types (POP, fee, keep-whole)
  objective: Explain processing contract types (POP, fee, keep-whole) and show it in the EX-013 output.
  prerequisites:
  - L02.02.4
  market_lesson: Fee contracts pay per unit, POP shares proceeds, keep-whole returns the producer's Btus and leaves the processor exposed to the frac spread. [K]
