section: '2.2'
title: Gathering systems and processing plants
exercise: EX-013
lessons:
- id: L02.02.1
  title: Gathering system function
  objective: Explain gathering system function and show it in the EX-013 output.
  prerequisites:
  - L02.01.5
  market_lesson: Gathering lines collect gas from many wells at low pressure and deliver it to processing. [K]
  north_american_example: 'EX-013 (Model Raw Gas Processing) on synthetic North American data: mode = recover [EX]'
  terminal_activity: python3 emi.py run 013 | grep '^mode:'
  expected_result: 'mode: recover'
  professional_application: Calculate the separation of methane and natural gas liquids from raw natural gas.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.01.5
  after: L02.02.2
  status: written_command_verified
- id: L02.02.2
  title: Compression and treating
  objective: Explain compression and treating and show it in the EX-013 output.
  prerequisites:
  - L02.02.1
  market_lesson: Compression raises pressure for transport; treating removes CO2, H2S and water. [K]
  north_american_example: 'EX-013 (Model Raw Gas Processing) on synthetic North American data: inlet_Mcf_per_d = 200000 [EX]'
  terminal_activity: python3 emi.py run 013 | grep '^inlet_Mcf_per_d:'
  expected_result: 'inlet_Mcf_per_d: 200000'
  professional_application: Calculate the separation of methane and natural gas liquids from raw natural gas.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.02.1
  after: L02.02.3
  status: written_command_verified
