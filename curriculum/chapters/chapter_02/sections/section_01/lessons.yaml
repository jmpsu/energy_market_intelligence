section: '2.1'
title: Natural gas production and resource basins
exercise: EX-010
lessons:
- id: L02.01.1
  title: Shale basin geography
  objective: Explain shale basin geography and show it in the EX-010 output.
  prerequisites:
  - L01.10.5
  market_lesson: Major US gas comes from a few shale basins; each has different costs, liquids content and distance to market. [K]
  north_american_example: 'EX-010 (Compare Major US Gas-Producing Basins) on synthetic North American data: Appalachian_netback_USD_per_MMBtu = 0.55 [EX]'
  terminal_activity: python3 emi.py run 010 | grep '^Appalachian_netback_USD_per_MMBtu:'
  expected_result: 'Appalachian_netback_USD_per_MMBtu: 0.55'
  professional_application: Analyze production volumes, growth rates, and economic characteristics across the Appalachian, Permian, and Haynesville basins.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L01.10.5
  after: L02.01.2
  status: written_command_verified
- id: L02.01.2
