  professional_application: Analyze production volumes, growth rates, and economic characteristics across the Appalachian, Permian, and Haynesville basins.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.01.3
  after: L02.01.5
  status: written_command_verified
- id: L02.01.5
  title: Basin takeaway dependence
  objective: Explain basin takeaway dependence and show it in the EX-010 output.
  prerequisites:
  - L02.01.4
  market_lesson: A basin with too little takeaway capacity sells at a discount until new pipe arrives. [K]
