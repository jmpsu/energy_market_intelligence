  title: Decline curves and drilling economics
  objective: Explain decline curves and drilling economics and show it in the EX-010 output.
  prerequisites:
  - L02.01.2
  market_lesson: Shale wells decline steeply, so steady output needs continuous drilling. [K]
  north_american_example: 'EX-010 (Compare Major US Gas-Producing Basins) on synthetic North American data: Haynesville_netback_USD_per_MMBtu = 0.85 [EX]'
