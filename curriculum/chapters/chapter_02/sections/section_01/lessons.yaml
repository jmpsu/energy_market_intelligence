- id: L02.01.4
  title: Breakeven and netback by basin
  objective: Explain breakeven and netback by basin and show it in the EX-010 output.
  prerequisites:
  - L02.01.3
  market_lesson: Netback is the market price minus the cost to get there; breakeven is the price at which a new well earns its return. [K]
  north_american_example: 'EX-010 (Compare Major US Gas-Producing Basins) on synthetic North American data: Appalachian_growth_pct = 3.529412 [EX]'
