  objective: Explain production volumes and growth rates and show it in the EX-010 output.
  prerequisites:
  - L02.01.1
  market_lesson: 'Growth rate matters as much as level: fast-growing basins outrun their pipelines. [K]'
  north_american_example: 'EX-010 (Compare Major US Gas-Producing Basins) on synthetic North American data: Permian_netback_USD_per_MMBtu = -0.45 [EX]'
  terminal_activity: python3 emi.py run 010 | grep '^Permian_netback_USD_per_MMBtu:'
  expected_result: 'Permian_netback_USD_per_MMBtu: -0.45'
  professional_application: Analyze production volumes, growth rates, and economic characteristics across the Appalachian, Permian, and Haynesville basins.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.01.1
  after: L02.01.3
  status: written_command_verified
