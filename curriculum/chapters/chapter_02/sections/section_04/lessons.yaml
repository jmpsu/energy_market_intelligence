section: '2.4'
title: Production, supply, and demand fundamentals
exercise: EX-026
lessons:
- id: L02.04.1
  title: Supply stack components
  objective: Explain supply stack components and show it in the EX-026 output.
  prerequisites:
  - L02.03.5
  market_lesson: Supply is production plus imports plus storage withdrawals. [K]
  north_american_example: 'EX-026 (Analyze Henry Hub Price Sensitivity) on synthetic North American data: Production_plus_2_price = 3.020005 [EX]'
  terminal_activity: python3 emi.py run 026 | grep '^Production_plus_2_price:'
  expected_result: 'Production_plus_2_price: 3.020005'
  professional_application: Simulate how changes in production, LNG exports, weather, and storage affect benchmark prices.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.03.5
  after: L02.04.2
  status: written_command_verified
