section: '2.5'
title: Interstate and intrastate pipeline infrastructure
exercise: EX-018
lessons:
- id: L02.05.1
  title: Interstate pipeline regulation
  objective: Explain interstate pipeline regulation and show it in the EX-018 output.
  prerequisites:
  - L02.04.5
  market_lesson: Interstate pipelines are FERC-regulated open-access carriers that sell transport, not gas. [K]
  north_american_example: 'EX-018 (Build a North American Gas Infrastructure Network) on synthetic North American data: nodes = 11 [EX]'
  terminal_activity: python3 emi.py run 018 | grep '^nodes:'
  expected_result: 'nodes: 11'
  professional_application: Represent production basins, processing plants, pipelines, storage facilities, LNG terminals, and market hubs as a connected network.
  product_implication: Physical gas data (capacity, storage, nominations) is the raw input customers expect a product to load and reconcile.
  before: L02.04.5
  after: L02.05.2
  status: written_command_verified
