section: '12.1'
title: Integrated gas and power market fundamentals
exercise: EX-066
lessons:
- id: L12.01.1
  title: Gas-power coupling
  objective: Explain gas-power coupling and show it in the EX-066 output.
  prerequisites:
  - L11.10.5
  market_lesson: Gas plants link the gas and power markets. [K]
  north_american_example: 'EX-066 (Model Gas-Electric Coordination) on synthetic North American data: fuel_needed_MMBtu_per_h = 7200 [EX]'
  terminal_activity: python3 emi.py run 066 | grep '^fuel_needed_MMBtu_per_h:'
  expected_result: 'fuel_needed_MMBtu_per_h: 7200'
  professional_application: Simulate how gas pipeline constraints affect the availability and dispatch of gas-fired power generators.
  product_implication: Integrated gas-power-NGL scenarios are the differentiator for a cross-commodity product; they depend on all earlier chapters.
  before: L11.10.5
  after: L12.01.2
  status: written_command_verified
