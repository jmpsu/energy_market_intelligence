section: '12.8'
title: Integrated data and simulation architecture
exercise: EX-099
lessons:
- id: L12.08.1
  title: Data architecture for integrated analytics
  objective: Explain data architecture for integrated analytics and show it in the EX-099 output.
  prerequisites:
  - L12.07.5
  market_lesson: Integrated analytics needs one model of locations, units and time. [K]
  north_american_example: 'EX-099 (Design an Energy Exemplar Product Integration) on synthetic North American data: components = 13 [EX]'
  terminal_activity: python3 emi.py run 099 | grep '^components:'
  expected_result: 'components: 13'
  professional_application: Develop a conceptual architecture connecting market data, simulation engines, analytical services, user workflows, and reporting. Distinguish verified product capabilities from proposed capabilities.
  product_implication: Integrated gas-power-NGL scenarios are the differentiator for a cross-commodity product; they depend on all earlier chapters.
  before: L12.07.5
  after: L12.08.2
  status: written_command_verified
