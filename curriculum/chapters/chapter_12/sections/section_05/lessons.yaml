section: '12.5'
title: Renewable and storage scenario modeling
exercise: EX-065
lessons:
- id: L12.05.1
  title: Renewable scenario generation
  objective: Explain renewable scenario generation and show it in the EX-065 output.
  prerequisites:
  - L12.04.5
  market_lesson: Renewable scenarios span plausible output paths. [K]
  north_american_example: 'EX-065 (Optimize a Combined Renewable and Storage Portfolio) on synthetic North American data: direct_solar_revenue_USD = 55910 [EX]'
  terminal_activity: python3 emi.py run 065 | grep '^direct_solar_revenue_USD:'
  expected_result: 'direct_solar_revenue_USD: 55910'
  professional_application: Calculate dispatch decisions across solar generation, battery storage, and market purchases.
  product_implication: Integrated gas-power-NGL scenarios are the differentiator for a cross-commodity product; they depend on all earlier chapters.
  before: L12.04.5
  after: L12.05.2
  status: written_command_verified
