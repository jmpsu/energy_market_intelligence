section: '12.6'
title: Transmission and pipeline disruption scenarios
exercise: EX-060
lessons:
- id: L12.06.1
  title: Transmission outage scenario
  objective: Explain transmission outage scenario and show it in the EX-060 output.
  prerequisites:
  - L12.05.5
  market_lesson: A transmission outage changes flows and prices. [K]
  north_american_example: 'EX-060 (Simulate Generator Outages) on synthetic North American data: Baseline_price_USD_per_MWh = 48 [EX]'
  terminal_activity: python3 emi.py run 060 | grep '^Baseline_price_USD_per_MWh:'
  expected_result: 'Baseline_price_USD_per_MWh: 48'
  professional_application: Remove generation capacity from a simplified power market and recalculate dispatch and market prices.
  product_implication: Integrated gas-power-NGL scenarios are the differentiator for a cross-commodity product; they depend on all earlier chapters.
  before: L12.05.5
  after: L12.06.2
  status: written_command_verified
