section: '12.3'
title: Physical and financial position reconciliation
exercise: EX-075
lessons:
- id: L12.03.1
  title: Physical position ledger
  objective: Explain physical position ledger and show it in the EX-075 output.
  prerequisites:
  - L12.02.5
  market_lesson: The physical ledger records volumes to deliver and receive. [K]
  north_american_example: 'EX-075 (Reconcile Physical and Financial Positions) on synthetic North American data: T001_mtm_USD = 5000 [EX]'
  terminal_activity: python3 emi.py run 075 | grep '^T001_mtm_USD:'
  expected_result: 'T001_mtm_USD: 5000'
  professional_application: Compare contracted volumes, scheduled quantities, delivered quantities, and financial settlements.
  product_implication: Integrated gas-power-NGL scenarios are the differentiator for a cross-commodity product; they depend on all earlier chapters.
  before: L12.02.5
  after: L12.03.2
  status: written_command_verified
