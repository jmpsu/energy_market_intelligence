section: '12.4'
title: Integrated gas-fired generation optimization
exercise: EX-068
lessons:
- id: L12.04.1
  title: Fuel constraints on dispatch
  objective: Explain fuel constraints on dispatch and show it in the EX-068 output.
  prerequisites:
  - L12.03.5
  market_lesson: Limited gas supply caps how many hours a plant can run. [K]
  north_american_example: 'EX-068 (Build a Multi-Commodity Asset Optimization Model) on synthetic North American data: gas_unit_margin_USD = 343055.555556 [EX]'
  terminal_activity: python3 emi.py run 068 | grep '^gas_unit_margin_USD:'
  expected_result: 'gas_unit_margin_USD: 343055.555556'
  professional_application: Optimize a portfolio containing gas supply, gas-fired generation, renewable assets, storage, and electricity market positions.
  product_implication: Integrated gas-power-NGL scenarios are the differentiator for a cross-commodity product; they depend on all earlier chapters.
  before: L12.03.5
  after: L12.04.2
  status: written_command_verified
