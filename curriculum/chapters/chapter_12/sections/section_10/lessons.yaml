section: '12.10'
title: Executive product strategy presentation
exercise: EX-100
lessons:
- id: L12.10.1
  title: Presentation storyline
  objective: Explain presentation storyline and show it in the EX-100 output.
  prerequisites:
  - L12.09.5
  market_lesson: The storyline goes problem, evidence, recommendation. [K]
  north_american_example: 'EX-100 (Complete an Integrated Energy Portfolio Capstone) on synthetic North American data: Base_portfolio_value_USD = 1617201.470588 [EX]'
  terminal_activity: python3 emi.py run 100 | grep '^Base_portfolio_value_USD:'
  expected_result: 'Base_portfolio_value_USD: 1617201.470588'
  professional_application: Build and analyze a hypothetical North American energy portfolio spanning natural gas, NGLs, electricity, generation assets, storage, trading positions, and market risk. Execute the analysis through the terminal, validate the results, identify commercial opportunities and risks, and present a product strategy explaining how an integrated simulation and analytics platform could support the decisions.
  product_implication: Integrated gas-power-NGL scenarios are the differentiator for a cross-commodity product; they depend on all earlier chapters.
  before: L12.09.5
  after: L12.10.2
  status: written_command_verified
