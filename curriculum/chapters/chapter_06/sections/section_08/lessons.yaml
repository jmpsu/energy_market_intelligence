section: '6.8'
title: Transmission constraints and network topology
exercise: EX-056
lessons:
- id: L06.08.1
  title: Thermal and stability limits
  objective: Explain thermal and stability limits and show it in the EX-056 output.
  prerequisites:
  - L06.07.5
  market_lesson: Lines are limited by heating, voltage and stability. [K]
  north_american_example: 'EX-056 (Model Transmission Congestion) on synthetic North American data: lmp_bus_1 = 20 [EX]'
  terminal_activity: python3 emi.py run 056 | grep '^lmp_bus_1:'
  expected_result: 'lmp_bus_1: 20'
  professional_application: Simulate a transmission constraint and calculate its effect on nodal electricity prices.
  product_implication: Power-market products are judged on nodal price accuracy and on explaining congestion, not on averages.
  before: L06.07.5
  after: L06.08.2
  status: written_command_verified
