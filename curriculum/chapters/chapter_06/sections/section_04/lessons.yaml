section: '6.4'
title: Vertically integrated and bilateral markets
exercise: EX-046
lessons:
- id: L06.04.1
  title: Southeast and Western bilateral markets
  objective: Explain southeast and Western bilateral markets and show it in the EX-046 output.
  prerequisites:
  - L06.03.5
  market_lesson: Outside ISOs, utilities self-schedule and trade bilaterally. [K]
  north_american_example: 'EX-046 (Compare ISO/RTO and Bilateral Markets) on synthetic North American data: iso_spot_seller = 42 [EX]'
  terminal_activity: python3 emi.py run 046 | grep '^iso_spot_seller:'
  expected_result: 'iso_spot_seller: 42'
  professional_application: Model differences between centrally organized wholesale markets and bilateral electricity transactions.
  product_implication: Power-market products are judged on nodal price accuracy and on explaining congestion, not on averages.
  before: L06.03.5
  after: L06.04.2
  status: written_command_verified
