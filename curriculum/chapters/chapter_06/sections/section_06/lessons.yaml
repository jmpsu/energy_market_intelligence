  professional_application: Break down electricity prices into energy, congestion, and marginal loss components.
  product_implication: Power-market products are judged on nodal price accuracy and on explaining congestion, not on averages.
  before: L06.06.3
  after: L06.06.5
  status: written_command_verified
- id: L06.06.5
  title: LMP calculation
  objective: Explain lMP calculation and show it in the EX-048 output.
  prerequisites:
