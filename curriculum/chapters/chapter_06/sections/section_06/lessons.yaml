section: '6.6'
title: Locational marginal pricing
exercise: EX-048
lessons:
- id: L06.06.1
  title: Marginal pricing principle
  objective: Explain marginal pricing principle and show it in the EX-048 output.
  prerequisites:
  - L06.05.5
  market_lesson: The price is set by the cost of the next unit needed to serve one more MW. [K]
  north_american_example: 'EX-048 (Calculate Locational Marginal Prices) on synthetic North American data: constrained_gen_A_MW = 350 [EX]'
  terminal_activity: python3 emi.py run 048 | grep '^constrained_gen_A_MW:'
  expected_result: 'constrained_gen_A_MW: 350'
  professional_application: Break down electricity prices into energy, congestion, and marginal loss components.
  product_implication: Power-market products are judged on nodal price accuracy and on explaining congestion, not on averages.
  before: L06.05.5
  after: L06.06.2
  status: written_command_verified
- id: L06.06.2
  title: Nodal price formation
  objective: Explain nodal price formation and show it in the EX-048 output.
  prerequisites:
  - L06.06.1
  market_lesson: 'With congestion, that marginal cost differs by location: locational marginal price. [K]'
  north_american_example: 'EX-048 (Calculate Locational Marginal Prices) on synthetic North American data: constrained_gen_B_MW = 150 [EX]'
  terminal_activity: python3 emi.py run 048 | grep '^constrained_gen_B_MW:'
  expected_result: 'constrained_gen_B_MW: 150'
  professional_application: Break down electricity prices into energy, congestion, and marginal loss components.
  product_implication: Power-market products are judged on nodal price accuracy and on explaining congestion, not on averages.
  before: L06.06.1
  after: L06.06.3
  status: written_command_verified
- id: L06.06.3
  title: Hubs, zones and nodes
  objective: Explain hubs, zones and nodes and show it in the EX-048 output.
  prerequisites:
  - L06.06.2
  market_lesson: Nodes are individual buses; zones and hubs are averages used for load and trading. [K]
  north_american_example: 'EX-048 (Calculate Locational Marginal Prices) on synthetic North American data: constrained_flow_A_to_B_MW = 250 [EX]'
  terminal_activity: python3 emi.py run 048 | grep '^constrained_flow_A_to_B_MW:'
  expected_result: 'constrained_flow_A_to_B_MW: 250'
  professional_application: Break down electricity prices into energy, congestion, and marginal loss components.
  product_implication: Power-market products are judged on nodal price accuracy and on explaining congestion, not on averages.
  before: L06.06.2
  after: L06.06.4
  status: written_command_verified
- id: L06.06.4
  title: Price caps and scarcity pricing
  objective: Explain price caps and scarcity pricing and show it in the EX-048 output.
  prerequisites:
  - L06.06.3
  market_lesson: Offer caps limit prices; scarcity pricing raises them when reserves run short. [K]
  north_american_example: 'EX-048 (Calculate Locational Marginal Prices) on synthetic North American data: constrained_lmp_A = 30 [EX]'
  terminal_activity: python3 emi.py run 048 | grep '^constrained_lmp_A:'
