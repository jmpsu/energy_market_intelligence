section: '6.10'
title: Ancillary services and wholesale settlements
exercise: EX-050
lessons:
- id: L06.10.1
  title: Regulation service
  objective: Explain regulation service and show it in the EX-050 output.
  prerequisites:
  - L06.09.5
  market_lesson: Regulation follows second-to-second imbalances. [K]
  north_american_example: 'EX-050 (Analyze Ancillary Services) on synthetic North American data: regulation_requirement_MW = 50 [EX]'
  terminal_activity: python3 emi.py run 050 | grep '^regulation_requirement_MW:'
  expected_result: 'regulation_requirement_MW: 50'
  professional_application: Model reserve requirements, regulation, contingency reserves, and their contribution to generator revenue.
  product_implication: Power-market products are judged on nodal price accuracy and on explaining congestion, not on averages.
  before: L06.09.5
  after: L06.10.2
  status: written_command_verified
