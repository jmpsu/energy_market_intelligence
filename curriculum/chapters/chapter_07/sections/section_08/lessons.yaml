section: '7.8'
title: Battery storage and state-of-charge constraints
exercise: EX-063
lessons:
- id: L07.08.1
  title: Battery parameters
  objective: Explain battery parameters and show it in the EX-063 output.
  prerequisites:
  - L07.07.5
  market_lesson: A battery is defined by power (MW), energy (MWh), efficiency and state-of-charge limits. [K]
  north_american_example: 'EX-063 (Simulate Battery Energy Storage Arbitrage) on synthetic North American data: lp_revenue_USD = 17731.111111 [EX]'
  terminal_activity: python3 emi.py run 063 | grep '^lp_revenue_USD:'
  expected_result: 'lp_revenue_USD: 17731.111111'
  professional_application: Optimize battery charging and discharging across hourly electricity prices, accounting for efficiency and capacity limits.
  product_implication: Asset models must respect operating constraints or customers will not trust dispatch and margin outputs.
  before: L07.07.5
  after: L07.08.2
  status: written_command_verified
