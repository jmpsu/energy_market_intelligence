section: '7.6'
title: Renewable generation and forecasting
exercise: EX-062
lessons:
- id: L07.06.1
  title: Wind and solar forecast methods
  objective: Explain wind and solar forecast methods and show it in the EX-062 output.
  prerequisites:
  - L07.05.5
  market_lesson: Wind and solar forecasts combine weather models with plant data. [K]
  north_american_example: 'EX-062 (Model Renewable Generation Forecast Errors) on synthetic North American data: mae_MW = 8.416667 [EX]'
  terminal_activity: python3 emi.py run 062 | grep '^mae_MW:'
  expected_result: 'mae_MW: 8.416667'
  professional_application: Compare forecast and actual wind or solar production; calculate the resulting financial exposure.
  product_implication: Asset models must respect operating constraints or customers will not trust dispatch and margin outputs.
  before: L07.05.5
  after: L07.06.2
  status: written_command_verified
