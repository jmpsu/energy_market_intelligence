section: '7.1'
title: Generation technologies and operating characteristics
exercise: EX-053
lessons:
- id: L07.01.1
  title: Thermal technologies
  objective: Explain thermal technologies and show it in the EX-053 output.
  prerequisites:
  - L06.10.5
  market_lesson: Thermal plants burn gas, coal or oil; combined cycles are efficient, peakers are flexible. [K]
  north_american_example: 'EX-053 (Calculate Generator Dispatch Economics) on synthetic North American data: NUC_cost = 9.28 [EX]'
  terminal_activity: python3 emi.py run 053 | grep '^NUC_cost:'
  expected_result: 'NUC_cost: 9.28'
  professional_application: Rank generators by marginal operating cost and determine their dispatch order.
  product_implication: Asset models must respect operating constraints or customers will not trust dispatch and margin outputs.
  before: L06.10.5
  after: L07.01.2
  status: written_command_verified
