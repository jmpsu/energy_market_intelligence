section: '7.10'
title: Integrated generation, storage, and portfolio optimization
exercise: EX-065
lessons:
- id: L07.10.1
  title: Portfolio dispatch
  objective: Explain portfolio dispatch and show it in the EX-065 output.
  prerequisites:
  - L07.09.5
  market_lesson: Portfolio dispatch runs several assets against one price view. [K]
  north_american_example: 'EX-065 (Optimize a Combined Renewable and Storage Portfolio) on synthetic North American data: direct_solar_revenue_USD = 55910 [EX]'
  terminal_activity: python3 emi.py run 065 | grep '^direct_solar_revenue_USD:'
  expected_result: 'direct_solar_revenue_USD: 55910'
  professional_application: Calculate dispatch decisions across solar generation, battery storage, and market purchases.
  product_implication: Asset models must respect operating constraints or customers will not trust dispatch and margin outputs.
  before: L07.09.5
  after: L07.10.2
  status: written_command_verified
