section: '7.3'
title: Gas-fired generation economics
exercise: EX-061
lessons:
- id: L07.03.1
  title: Combined-cycle vs peaker economics
  objective: Explain combined-cycle vs peaker economics and show it in the EX-061 output.
  prerequisites:
  - L07.02.5
  market_lesson: A combined cycle has higher capital cost and lower heat rate than a peaker, so it runs more hours. [K]
  north_american_example: 'EX-061 (Optimize a Natural Gas-Fired Generator) on synthetic North American data: marginal_cost_USD_per_MWh = 26.4 [EX]'
  terminal_activity: python3 emi.py run 061 | grep '^marginal_cost_USD_per_MWh:'
  expected_result: 'marginal_cost_USD_per_MWh: 26.4'
  professional_application: Determine when a generator should operate based on gas prices, electricity prices, heat rate, and operating constraints.
  product_implication: Asset models must respect operating constraints or customers will not trust dispatch and margin outputs.
  before: L07.02.5
  after: L07.03.2
  status: written_command_verified
