section: '7.9'
title: Long-duration and seasonal storage
exercise: EX-064
lessons:
- id: L07.09.1
  title: Long-duration storage technologies
  objective: Explain long-duration storage technologies and show it in the EX-064 output.
  prerequisites:
  - L07.08.5
  market_lesson: Long-duration storage includes pumped hydro and other multi-hour to multi-day technologies. [K]
  north_american_example: 'EX-064 (Analyze Dunkelflaute Conditions) on synthetic North American data: daily_gap_in_lull_MWh = 3120 [EX]'
  terminal_activity: python3 emi.py run 064 | grep '^daily_gap_in_lull_MWh:'
  expected_result: 'daily_gap_in_lull_MWh: 3120'
  professional_application: Simulate prolonged periods of low wind and solar generation and quantify the resulting scarcity exposure.
  product_implication: Asset models must respect operating constraints or customers will not trust dispatch and margin outputs.
  before: L07.08.5
  after: L07.09.2
  status: written_command_verified
