section: '7.4'
title: Spark spreads and fuel procurement
exercise: EX-055
lessons:
- id: L07.04.1
  title: Spark spread definition
  objective: Explain spark spread definition and show it in the EX-055 output.
  prerequisites:
  - L07.03.5
  market_lesson: Spark spread is power price minus heat rate times gas price. [K]
  north_american_example: 'EX-055 (Calculate Spark Spreads) on synthetic North American data: hour_1_spark_USD_per_MWh = 21 [EX]'
  terminal_activity: python3 emi.py run 055 | grep '^hour_1_spark_USD_per_MWh:'
  expected_result: 'hour_1_spark_USD_per_MWh: 21'
  professional_application: Compare electricity revenue with natural gas fuel costs and variable operating expenses.
  product_implication: Asset models must respect operating constraints or customers will not trust dispatch and margin outputs.
  before: L07.03.5
  after: L07.04.2
  status: written_command_verified
