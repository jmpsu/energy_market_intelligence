  professional_application: Compare forecast and actual wind or solar production; calculate the resulting financial exposure.
  product_implication: Asset models must respect operating constraints or customers will not trust dispatch and margin outputs.
  before: L07.07.2
  after: L07.07.4
  status: written_command_verified
- id: L07.07.4
