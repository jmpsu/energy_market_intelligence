  objective: Explain economic vs reliability curtailment and show it in the EX-062 output.
  prerequisites:
  - L07.07.2
  market_lesson: Economic curtailment follows price; reliability curtailment is an operator order. [K]
  north_american_example: 'EX-062 (Model Renewable Generation Forecast Errors) on synthetic North American data: mape_pct = 35.290738 [EX]'
  terminal_activity: python3 emi.py run 062 | grep '^mape_pct:'
