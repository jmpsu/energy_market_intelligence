section: '4.8'
title: LNG liquefaction, shipping, and regasification
exercise: EX-032
lessons:
- id: L04.08.1
  title: Liquefaction process and capacity
  objective: Explain liquefaction process and capacity and show it in the EX-032 output.
  prerequisites:
  - L04.07.5
  market_lesson: Liquefaction chills gas to a liquid for shipping; capacity is counted per train. [K]
  north_american_example: 'EX-032 (Analyze LNG Feedgas Demand) on synthetic North American data: lng_capacity_Bcf_d = 15.8 [EX]'
  terminal_activity: python3 emi.py run 032 | grep '^lng_capacity_Bcf_d:'
  expected_result: 'lng_capacity_Bcf_d: 15.8'
  professional_application: Model how LNG terminal utilization affects domestic natural gas demand and regional pricing.
  product_implication: Network and scenario features sell when users can change one constraint and see flows and basis respond.
  before: L04.07.5
  after: L04.08.2
  status: written_command_verified
