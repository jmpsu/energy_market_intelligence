section: '4.9'
title: Global Henry Hub, TTF, and JKM relationships
exercise: EX-034
lessons:
- id: L04.09.1
  title: Global benchmark definitions
  objective: Explain global benchmark definitions and show it in the EX-034 output.
  prerequisites:
  - L04.08.5
  market_lesson: TTF is the European gas benchmark; JKM is the Northeast Asian LNG benchmark. [K]
  north_american_example: 'EX-034 (Compare Henry Hub, TTF, and JKM) on synthetic North American data: months = 36 [EX]'
  terminal_activity: python3 emi.py run 034 | grep '^months:'
  expected_result: 'months: 36'
  professional_application: Analyze the relationship between North American, European, and Asian gas benchmarks.
  product_implication: Network and scenario features sell when users can change one constraint and see flows and basis respond.
  before: L04.08.5
  after: L04.09.2
  status: written_command_verified
