section: '4.5'
title: Capacity release and secondary markets
exercise: EX-014
lessons:
- id: L04.05.1
  title: Capacity release mechanics
  objective: Explain capacity release mechanics and show it in the EX-014 output.
  prerequisites:
  - L04.04.5
  market_lesson: A firm shipper can release unused capacity to another shipper for a period. [K]
  north_american_example: 'EX-014 (Analyze Pipeline Capacity) on synthetic North American data: Permian_to_Gulf_utilization_pct = 99.459459 [EX]'
  terminal_activity: python3 emi.py run 014 | grep '^Permian_to_Gulf_utilization_pct:'
  expected_result: 'Permian_to_Gulf_utilization_pct: 99.459459'
  professional_application: Compare nameplate capacity, operational capacity, contracted capacity, available capacity, and actual throughput.
  product_implication: Network and scenario features sell when users can change one constraint and see flows and basis respond.
  before: L04.04.5
  after: L04.05.2
  status: written_command_verified
