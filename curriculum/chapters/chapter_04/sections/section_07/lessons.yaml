section: '4.7'
title: Mexican natural gas imports and exports
exercise: EX-035
lessons:
- id: L04.07.1
  title: US pipeline exports to Mexico
  objective: Explain uS pipeline exports to Mexico and show it in the EX-035 output.
  prerequisites:
  - L04.06.5
  market_lesson: US pipeline exports to Mexico are a major, steady demand source. [K]
  north_american_example: 'EX-035 (Model US-Canada-Mexico Gas Flows) on synthetic North American data: United_States_residual_Bcf_d = 8 [EX]'
  terminal_activity: python3 emi.py run 035 | grep '^United_States_residual_Bcf_d:'
  expected_result: 'United_States_residual_Bcf_d: 8'
  professional_application: Build a cross-border supply and demand balance incorporating imports, exports, and pipeline constraints.
  product_implication: Network and scenario features sell when users can change one constraint and see flows and basis respond.
  before: L04.06.5
  after: L04.07.2
  status: written_command_verified
