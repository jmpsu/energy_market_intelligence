section: '4.6'
title: Canadian natural gas infrastructure and AECO
exercise: EX-011
lessons:
- id: L04.06.1
  title: WCSB and Montney supply
  objective: Explain wCSB and Montney supply and show it in the EX-011 output.
  prerequisites:
  - L04.05.5
  market_lesson: Western Canada's basin, led by the Montney, supplies Canada and exports to the US. [K]
  north_american_example: 'EX-011 (Analyze Canadian Natural Gas Supply) on synthetic North American data: total_2026_Bcf_d = 19 [EX]'
  terminal_activity: python3 emi.py run 011 | grep '^total_2026_Bcf_d:'
  expected_result: 'total_2026_Bcf_d: 19'
  professional_application: Compare production from the Montney, Duvernay, and Western Canadian Sedimentary Basin.
  product_implication: Network and scenario features sell when users can change one constraint and see flows and basis respond.
  before: L04.05.5
  after: L04.06.2
  status: written_command_verified
