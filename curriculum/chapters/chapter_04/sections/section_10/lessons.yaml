section: '4.10'
title: Infrastructure disruption and scenario analysis
exercise: EX-036
lessons:
- id: L04.10.1
  title: Outage scenario design
  objective: Explain outage scenario design and show it in the EX-036 output.
  prerequisites:
  - L04.09.5
  market_lesson: An outage scenario states which asset fails, by how much and for how long. [K]
  north_american_example: 'EX-036 (Simulate a Winter Gas Supply Disruption) on synthetic North American data: peak_demand_Bcf_d = 25.26 [EX]'
  terminal_activity: python3 emi.py run 036 | grep '^peak_demand_Bcf_d:'
  expected_result: 'peak_demand_Bcf_d: 25.26'
  professional_application: Model how extreme weather, production declines, pipeline constraints, and storage withdrawals affect regional markets.
  product_implication: Network and scenario features sell when users can change one constraint and see flows and basis respond.
  before: L04.09.5
  after: L04.10.2
  status: written_command_verified
- id: L04.10.2
