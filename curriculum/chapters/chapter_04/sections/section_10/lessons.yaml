  professional_application: Model how extreme weather, production declines, pipeline constraints, and storage withdrawals affect regional markets.
  product_implication: Network and scenario features sell when users can change one constraint and see flows and basis respond.
  before: L04.10.1
  after: L04.10.3
  status: written_command_verified
