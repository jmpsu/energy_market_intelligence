- id: L04.04.4
  title: Congestion and basis blowouts
  objective: Explain congestion and basis blowouts and show it in the EX-014 output.
  prerequisites:
  - L04.04.3
  market_lesson: When a constraint tightens, basis on either side widens fast. [K]
  north_american_example: 'EX-014 (Analyze Pipeline Capacity) on synthetic North American data: Rockies_to_West_utilization_pct = 100.555556 [EX]'
  terminal_activity: python3 emi.py run 014 | grep '^Rockies_to_West_utilization_pct:'
