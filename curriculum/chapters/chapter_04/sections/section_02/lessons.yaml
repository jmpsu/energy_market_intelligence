section: '4.2'
title: Pipeline tariffs and transportation rights
exercise: EX-016
lessons:
- id: L04.02.1
  title: Tariff structure
  objective: Explain tariff structure and show it in the EX-016 output.
  prerequisites:
  - L04.01.5
  market_lesson: A tariff lists the services, rates and rules a pipeline must offer every shipper. [K]
  north_american_example: 'EX-016 (Calculate Pipeline Transportation Economics) on synthetic North American data: breakeven_load_factor = 0.849057 [EX]'
  terminal_activity: python3 emi.py run 016 | grep '^breakeven_load_factor:'
  expected_result: 'breakeven_load_factor: 0.849057'
  professional_application: Compare firm and interruptible transportation costs under different market conditions.
  product_implication: Network and scenario features sell when users can change one constraint and see flows and basis respond.
  before: L04.01.5
  after: L04.02.2
  status: written_command_verified
