section: '10.4'
title: Linear, mixed-integer, and stochastic optimization
exercise: EX-091
lessons:
- id: L10.04.1
  title: Linear programming
  objective: Explain linear programming and show it in the EX-091 output.
  prerequisites:
  - L10.03.5
  market_lesson: Linear programming solves linear problems to proven optimality. [K]
  north_american_example: 'EX-091 (Develop a Capacity Expansion Model) on synthetic North American data: total_cost_USD_per_yr = 550080000 [EX]'
  terminal_activity: python3 emi.py run 091 | grep '^total_cost_USD_per_yr:'
  expected_result: 'total_cost_USD_per_yr: 550080000'
  professional_application: Determine which generation resources should be added to meet future electricity demand at minimum modeled cost.
  product_implication: 'Simulation speed and result equivalence are product features: faster runs only count if the answers are proven unchanged.'
  before: L10.03.5
  after: L10.04.2
  status: written_command_verified
