section: '10.5'
title: Forecasting versus fundamental simulation
exercise: EX-077
lessons:
- id: L10.05.1
  title: Statistical forecasting scope
  objective: Explain statistical forecasting scope and show it in the EX-077 output.
  prerequisites:
  - L10.04.5
  market_lesson: Statistical forecasting fits patterns in history. [K]
  north_american_example: 'EX-077 (Build a Natural Gas Price Forecast) on synthetic North American data: train_rows = 300 [EX]'
  terminal_activity: python3 emi.py run 077 | grep '^train_rows:'
  expected_result: 'train_rows: 300'
  professional_application: Use historical prices and explanatory variables to develop a baseline forecasting model.
  product_implication: 'Simulation speed and result equivalence are product features: faster runs only count if the answers are proven unchanged.'
  before: L10.04.5
  after: L10.05.2
  status: written_command_verified
