section: '10.3'
title: Power-flow and production-cost simulation
exercise: EX-089
lessons:
- id: L10.03.1
  title: AC vs DC power flow
  objective: Explain aC vs DC power flow and show it in the EX-089 output.
  prerequisites:
  - L10.02.5
  market_lesson: AC power flow is exact and nonlinear; DC is approximate and fast. [K]
  north_american_example: 'EX-089 (Create a Power Market Simulation) on synthetic North American data: total_demand_MWh = 105600 [EX]'
  terminal_activity: python3 emi.py run 089 | grep '^total_demand_MWh:'
  expected_result: 'total_demand_MWh: 105600'
  professional_application: Build a simplified production-cost model that dispatches generators against hourly demand and operating constraints.
  product_implication: 'Simulation speed and result equivalence are product features: faster runs only count if the answers are proven unchanged.'
  before: L10.02.5
  after: L10.03.2
  status: written_command_verified
