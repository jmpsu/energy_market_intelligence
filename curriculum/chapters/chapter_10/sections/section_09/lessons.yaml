- id: L10.09.1
  title: Calibration methods
  objective: Explain calibration methods and show it in the EX-094 output.
  prerequisites:
  - L10.08.5
  market_lesson: Calibration tunes parameters so outputs match observations. [K]
  north_american_example: 'EX-094 (Build a Simulation Validation Framework) on synthetic North American data: hours = 48 [EX]'
  terminal_activity: python3 emi.py run 094 | grep '^hours:'
  expected_result: 'hours: 48'
  professional_application: Compare model outputs against historical observations and independent calculations; identify calibration errors and structural limitations.
  product_implication: 'Simulation speed and result equivalence are product features: faster runs only count if the answers are proven unchanged.'
  before: L10.08.5
  after: L10.09.2
  status: written_command_verified
