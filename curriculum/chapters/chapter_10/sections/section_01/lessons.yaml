section: '10.1'
title: Mathematical foundations of energy-market models
exercise: EX-090
lessons:
- id: L10.01.1
  title: Optimization problem structure
  objective: Explain optimization problem structure and show it in the EX-090 output.
  prerequisites:
  - L09.10.5
  market_lesson: An optimisation has decision variables, an objective and constraints. [K]
  north_american_example: 'EX-090 (Build a Gas Network Simulation) on synthetic North American data: base_transport_cost_USD_per_d = 19750000 [EX]'
  terminal_activity: python3 emi.py run 090 | grep '^base_transport_cost_USD_per_d:'
  expected_result: 'base_transport_cost_USD_per_d: 19750000'
  professional_application: Model interconnected supply sources, pipelines, storage facilities, demand centers, and transportation constraints.
  product_implication: 'Simulation speed and result equivalence are product features: faster runs only count if the answers are proven unchanged.'
  before: L09.10.5
  after: L10.01.2
  status: written_command_verified
