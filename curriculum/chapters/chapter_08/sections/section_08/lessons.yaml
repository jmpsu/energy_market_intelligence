section: '8.8'
title: P&L attribution and explain
exercise: EX-071
lessons:
- id: L08.08.1
  title: New-deal P&L
  objective: Explain new-deal P&L and show it in the EX-071 output.
  prerequisites:
  - L08.07.5
  market_lesson: New-deal P&L is the value of today's trades against today's curve. [K]
  north_american_example: 'EX-071 (Calculate Daily Trading P&L) on synthetic North American data: mtm_day1_USD = 59500 [EX]'
  terminal_activity: python3 emi.py run 071 | grep '^mtm_day1_USD:'
  expected_result: 'mtm_day1_USD: 59500'
  professional_application: Revalue a portfolio using updated market prices and calculate daily gains and losses.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L08.07.5
  after: L08.08.2
  status: written_command_verified
