section: '8.4'
title: Position management and portfolio accounting
exercise: EX-075
lessons:
- id: L08.04.1
  title: Position aggregation
  objective: Explain position aggregation and show it in the EX-075 output.
  prerequisites:
  - L08.03.5
  market_lesson: Positions aggregate by commodity, location and delivery period. [K]
  north_american_example: 'EX-075 (Reconcile Physical and Financial Positions) on synthetic North American data: T001_mtm_USD = 5000 [EX]'
  terminal_activity: python3 emi.py run 075 | grep '^T001_mtm_USD:'
  expected_result: 'T001_mtm_USD: 5000'
  professional_application: Compare contracted volumes, scheduled quantities, delivered quantities, and financial settlements.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L08.03.5
  after: L08.04.2
  status: written_command_verified
