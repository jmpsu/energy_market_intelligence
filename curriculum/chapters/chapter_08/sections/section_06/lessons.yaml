section: '8.6'
title: Scheduling, nominations, and physical operations
exercise: EX-074
lessons:
- id: L08.06.1
  title: Power scheduling and e-Tags
  objective: Explain power scheduling and e-Tags and show it in the EX-074 output.
  prerequisites:
  - L08.05.5
  market_lesson: Power schedules are communicated with e-Tags naming the path from source to sink. [K]
  north_american_example: 'EX-074 (Build a Physical Gas Scheduling Workflow) on synthetic North American data: receipt_needed_MMBtu = 56122.44898 [EX]'
  terminal_activity: python3 emi.py run 074 | grep '^receipt_needed_MMBtu:'
  expected_result: 'receipt_needed_MMBtu: 56122.44898'
  professional_application: Connect trade quantities to transportation capacity, nominations, confirmations, and delivery schedules.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L08.05.5
  after: L08.06.2
  status: written_command_verified
