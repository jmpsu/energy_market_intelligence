section: '8.2'
title: Trade capture and transaction management
exercise: EX-069
lessons:
- id: L08.02.1
  title: Trade attributes
  objective: Explain trade attributes and show it in the EX-069 output.
  prerequisites:
  - L08.01.5
  market_lesson: A trade record holds counterparty, commodity, location, volume, price, term and book. [K]
  north_american_example: 'EX-069 (Build a Trade Capture System) on synthetic North American data: submitted = 9 [EX]'
  terminal_activity: python3 emi.py run 069 | grep '^submitted:'
  expected_result: 'submitted: 9'
  professional_application: Create a structured trade record containing commodity, counterparty, location, volume, price, delivery period, and contract type.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L08.01.5
  after: L08.02.2
  status: written_command_verified
