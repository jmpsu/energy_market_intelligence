section: '8.9'
title: Credit and counterparty management
exercise: EX-073
lessons:
- id: L08.09.1
  title: Credit exposure calculation
  objective: Explain credit exposure calculation and show it in the EX-073 output.
  prerequisites:
  - L08.08.5
  market_lesson: Credit exposure is what a counterparty would owe if it defaulted today. [K]
  north_american_example: 'EX-073 (Simulate Counterparty Credit Exposure) on synthetic North American data: CP_A_exposure_USD = 600000 [EX]'
  terminal_activity: python3 emi.py run 073 | grep '^CP_A_exposure_USD:'
  expected_result: 'CP_A_exposure_USD: 600000'
  professional_application: Calculate exposure across counterparties and identify concentrations exceeding hypothetical credit limits.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L08.08.5
  after: L08.09.2
  status: written_command_verified
