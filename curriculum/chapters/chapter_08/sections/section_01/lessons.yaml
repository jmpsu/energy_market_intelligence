section: '8.1'
title: Front, middle, and back office
exercise: EX-072
lessons:
- id: L08.01.1
  title: Front-office functions
  objective: Explain front-office functions and show it in the EX-072 output.
  prerequisites:
  - L07.10.5
  market_lesson: The front office trades, originates and optimises assets. [K]
  north_american_example: 'EX-072 (Build a Trade Lifecycle) on synthetic North American data: events = 13 [EX]'
  terminal_activity: python3 emi.py run 072 | grep '^events:'
  expected_result: 'events: 13'
  professional_application: Model trade capture, confirmation, scheduling, delivery, settlement, and accounting.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L07.10.5
  after: L08.01.2
  status: written_command_verified
