section: '8.10'
title: ETRM architecture, integrations, and data warehouses
exercise: EX-076
lessons:
- id: L08.10.1
  title: ETRM functional modules
  objective: Explain eTRM functional modules and show it in the EX-076 output.
  prerequisites:
  - L08.09.5
  market_lesson: An ETRM has trade capture, scheduling, risk, settlement and accounting modules. [K]
  north_american_example: 'EX-076 (Design an ETRM Data Integration) on synthetic North American data: trades_in_store = 4 [EX]'
  terminal_activity: python3 emi.py run 076 | grep '^trades_in_store:'
  expected_result: 'trades_in_store: 4'
  professional_application: Build a simplified integration connecting trading records, market data, risk calculations, scheduling, and settlement systems.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L08.09.5
  after: L08.10.2
  status: written_command_verified
