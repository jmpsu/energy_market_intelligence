section: '8.7'
title: Settlements and reconciliation
exercise: EX-052
lessons:
- id: L08.07.1
  title: Invoice generation
  objective: Explain invoice generation and show it in the EX-052 output.
  prerequisites:
  - L08.06.5
  market_lesson: Invoices are generated from actual volumes and contract prices. [K]
  north_american_example: 'EX-052 (Model Electricity Market Settlements) on synthetic North American data: day_ahead_energy_USD = 21000 [EX]'
  terminal_activity: python3 emi.py run 052 | grep '^day_ahead_energy_USD:'
  expected_result: 'day_ahead_energy_USD: 21000'
  professional_application: Calculate the financial difference between scheduled quantities, actual generation, and market settlement prices.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L08.06.5
  after: L08.07.2
  status: written_command_verified
