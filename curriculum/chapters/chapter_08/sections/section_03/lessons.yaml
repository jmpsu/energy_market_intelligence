section: '8.3'
title: Market data and forward curves
exercise: EX-070
lessons:
- id: L08.03.1
  title: Market data sourcing
  objective: Explain market data sourcing and show it in the EX-070 output.
  prerequisites:
  - L08.02.5
  market_lesson: Market data comes from exchanges, brokers, price agencies and ISOs. [K]
  north_american_example: 'EX-070 (Build a Market Data Ingestion Pipeline) on synthetic North American data: raw_rows = 10 [EX]'
  terminal_activity: python3 emi.py run 070 | grep '^raw_rows:'
  expected_result: 'raw_rows: 10'
  professional_application: Import historical prices, validate records, detect missing observations, and store clean market data.
  product_implication: 'ETRM integration is where products succeed or fail: trade, price and position interfaces need explicit data contracts.'
  before: L08.02.5
  after: L08.03.2
  status: written_command_verified
