section: '9.8'
title: Funding, liquidity, and counterparty risk
exercise: EX-073
lessons:
- id: L09.08.1
  title: Margin and funding needs
  objective: Explain margin and funding needs and show it in the EX-073 output.
  prerequisites:
  - L09.07.5
  market_lesson: Price moves create margin calls that need cash. [K]
  north_american_example: 'EX-073 (Simulate Counterparty Credit Exposure) on synthetic North American data: CP_A_exposure_USD = 600000 [EX]'
  terminal_activity: python3 emi.py run 073 | grep '^CP_A_exposure_USD:'
  expected_result: 'CP_A_exposure_USD: 600000'
  professional_application: Calculate exposure across counterparties and identify concentrations exceeding hypothetical credit limits.
  product_implication: Risk features need transparent methods and reproducible numbers; a black-box VaR is not accepted by a middle office.
  before: L09.07.5
  after: L09.08.2
  status: written_command_verified
