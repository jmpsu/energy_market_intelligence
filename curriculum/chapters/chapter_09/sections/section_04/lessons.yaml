section: '9.4'
title: Supply-demand fundamental models
exercise: EX-049
lessons:
- id: L09.04.1
  title: Supply curve construction
  objective: Explain supply curve construction and show it in the EX-049 output.
  prerequisites:
  - L09.03.5
  market_lesson: A supply curve orders capacity by marginal cost. [K]
  north_american_example: 'EX-049 (Model Electricity Market Clearing) on synthetic North American data: clearing_price_USD_per_MWh = 42 [EX]'
  terminal_activity: python3 emi.py run 049 | grep '^clearing_price_USD_per_MWh:'
  expected_result: 'clearing_price_USD_per_MWh: 42'
  professional_application: Construct a simplified supply stack and determine the market-clearing price.
  product_implication: Risk features need transparent methods and reproducible numbers; a black-box VaR is not accepted by a middle office.
  before: L09.03.5
  after: L09.04.2
  status: written_command_verified
