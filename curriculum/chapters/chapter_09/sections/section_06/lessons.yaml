section: '9.6'
title: VaR and Expected Shortfall
exercise: EX-081
lessons:
- id: L09.06.1
  title: VaR concepts
  objective: Explain vaR concepts and show it in the EX-081 output.
  prerequisites:
  - L09.05.5
  market_lesson: VaR is the loss not exceeded at a confidence level over a horizon. [K]
  north_american_example: 'EX-081 (Calculate Value at Risk) on synthetic North American data: observations = 500 [EX]'
  terminal_activity: python3 emi.py run 081 | grep '^observations:'
  expected_result: 'observations: 500'
  professional_application: Estimate portfolio losses at a specified confidence level and holding period.
  product_implication: Risk features need transparent methods and reproducible numbers; a black-box VaR is not accepted by a middle office.
  before: L09.05.5
  after: L09.06.2
  status: written_command_verified
