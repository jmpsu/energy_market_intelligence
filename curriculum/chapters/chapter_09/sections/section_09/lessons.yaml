section: '9.9'
title: Scenario analysis and stress testing
exercise: EX-084
lessons:
- id: L09.09.1
  title: Scenario design
  objective: Explain scenario design and show it in the EX-084 output.
  prerequisites:
  - L09.08.5
  market_lesson: A stress scenario is a specific, severe set of price moves. [K]
  north_american_example: 'EX-084 (Perform Energy Portfolio Stress Testing) on synthetic North American data: Gas_Collapse_change_USD = -533522.647059 [EX]'
  terminal_activity: python3 emi.py run 084 | grep '^Gas_Collapse_change_USD:'
  expected_result: 'Gas_Collapse_change_USD: -533522.647059'
  professional_application: Evaluate portfolio losses under extreme gas prices, electricity scarcity, pipeline outages, and weather events.
  product_implication: Risk features need transparent methods and reproducible numbers; a black-box VaR is not accepted by a middle office.
  before: L09.08.5
  after: L09.09.2
  status: written_command_verified
