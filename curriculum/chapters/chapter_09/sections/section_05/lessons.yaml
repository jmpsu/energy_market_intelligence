section: '9.5'
title: Forward-curve construction
exercise: EX-023
lessons:
- id: L09.05.1
  title: Quote sources
  objective: Explain quote sources and show it in the EX-023 output.
  prerequisites:
  - L09.04.5
  market_lesson: Curve inputs are exchange settlements and broker quotes. [K]
  north_american_example: 'EX-023 (Build a Natural Gas Forward Curve) on synthetic North American data: calendar_strip_USD_per_MMBtu = 3.25 [EX]'
  terminal_activity: python3 emi.py run 023 | grep '^calendar_strip_USD_per_MMBtu:'
  expected_result: 'calendar_strip_USD_per_MMBtu: 3.25'
  professional_application: Construct a forward price curve from monthly market observations and calculate its shape.
  product_implication: Risk features need transparent methods and reproducible numbers; a black-box VaR is not accepted by a middle office.
  before: L09.04.5
  after: L09.05.2
  status: written_command_verified
