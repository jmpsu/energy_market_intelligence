section: '9.3'
title: Energy price forecasting
exercise: EX-077
lessons:
- id: L09.03.1
  title: Forecast horizons
  objective: Explain forecast horizons and show it in the EX-077 output.
  prerequisites:
  - L09.02.5
  market_lesson: Short horizons lean on weather and current data; long horizons on fundamentals. [K]
  north_american_example: 'EX-077 (Build a Natural Gas Price Forecast) on synthetic North American data: train_rows = 300 [EX]'
  terminal_activity: python3 emi.py run 077 | grep '^train_rows:'
  expected_result: 'train_rows: 300'
  professional_application: Use historical prices and explanatory variables to develop a baseline forecasting model.
  product_implication: Risk features need transparent methods and reproducible numbers; a black-box VaR is not accepted by a middle office.
  before: L09.02.5
  after: L09.03.2
  status: written_command_verified
