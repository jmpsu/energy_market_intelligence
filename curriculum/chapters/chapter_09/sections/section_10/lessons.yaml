section: '9.10'
title: Structured products, options, and weather derivatives
exercise: EX-085
lessons:
- id: L09.10.1
  title: Option pricing basics
  objective: Explain option pricing basics and show it in the EX-085 output.
  prerequisites:
  - L09.09.5
  market_lesson: Option value depends on price, strike, volatility, time and rates. [K]
  north_american_example: 'EX-085 (Build a Weather Derivatives Valuation Model) on synthetic North American data: hdd_rows_verified = 15 [EX]'
  terminal_activity: python3 emi.py run 085 | grep '^hdd_rows_verified:'
  expected_result: 'hdd_rows_verified: 15'
  professional_application: Calculate hypothetical financial exposures linked to heating or cooling degree days.
  product_implication: Risk features need transparent methods and reproducible numbers; a black-box VaR is not accepted by a middle office.
  before: L09.09.5
  after: L09.10.2
  status: written_command_verified
