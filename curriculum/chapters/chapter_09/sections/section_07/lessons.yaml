section: '9.7'
title: Potential Future Exposure and Earnings at Risk
exercise: EX-083
lessons:
- id: L09.07.1
  title: Exposure profiles
  objective: Explain exposure profiles and show it in the EX-083 output.
  prerequisites:
  - L09.06.5
  market_lesson: An exposure profile shows possible future value through time. [K]
  north_american_example: 'EX-083 (Model Potential Future Exposure) on synthetic North American data: peak_pfe_USD = 1428316.177291 [EX]'
  terminal_activity: python3 emi.py run 083 | grep '^peak_pfe_USD:'
  expected_result: 'peak_pfe_USD: 1428316.177291'
  professional_application: Estimate how counterparty exposure may evolve under simulated future market conditions.
  product_implication: Risk features need transparent methods and reproducible numbers; a black-box VaR is not accepted by a middle office.
  before: L09.06.5
  after: L09.07.2
  status: written_command_verified
