section: '5.1'
title: Natural gas liquids and hydrocarbon composition
lessons:
- id: L05.01.1
  title: NGL component properties
  prerequisite: L04.10.5
  status: written
  objective: Name the five NGL purity products and place each on the carbon ladder.
  market_lesson: NGLs are ethane (C2), propane (C3), normal butane and isobutane (C4) and natural gasoline or pentanes-plus (C5+) [S1]. EIA groups them with refinery olefins as hydrocarbon gas liquids (HGL) [S1]. Heavier molecule = more Btu per gallon, more pounds per gallon, higher price per gallon [EX].
  example: In data/synthetic/ngl_components.csv ethane carries 0.0665 MMBtu/gal and natural gasoline 0.1100 MMBtu/gal (rounded engineering factors).
  terminal_activity: cat data/synthetic/ngl_components.csv
  expected_result: Five rows, C2 to C5+, MMBtu_per_gal and lb_per_gal rising down the table.
  professional_application: Every NGL report you will read is organised by these five products; a number without the product name is unusable.
  product_implication: Product is a mandatory dimension on every price, volume and position record.
  builds_on: L04.10.5
  leads_to: L05.01.2
- id: L05.01.2
  title: Gallons per Mcf (GPM)
  prerequisite: L05.01.1
  status: written
  objective: Convert a gas analysis in mol% to gallons per Mcf (GPM).
  market_lesson: GPM = mol% x a component factor (gal per Mcf per mol%). Summed over C2+ it measures how rich (wet) the gas is [K]. Rich gas means more liquids revenue per Mcf processed.
  example: 'Synthetic inlet gas: 10.5% C2, 5.0% C3, 0.7% iC4, 1.5% nC4, 1.3% C5+ gives 5.3519 GPM.'
  terminal_activity: python3 emi.py run 037
  expected_result: 'theoretical_gpm: 5.3519'
  professional_application: Producers and processors quote gas richness in GPM when negotiating processing deals and forecasting plant liquids.
  product_implication: A composition table per meter or plant inlet is core reference data; GPM is derived, never typed in.
  builds_on: L05.01.1
  leads_to: L05.01.3
- id: L05.01.3
  title: Btu content and value
  prerequisite: L05.01.2
  status: written
  objective: Convert recovered gallons to shrink in MMBtu and to fuel value.
  market_lesson: 'Liquids removed from the gas stream take their Btu with them: shrink (MMBtu) = gallons x MMBtu/gal. Fuel value per gallon = MMBtu/gal x gas price. That is what the molecule is worth if left in the gas [EX].'
  example: At 3.25 USD/MMBtu, ethane fuel value = 0.0665 x 3.25 = 0.2161 USD/gal; propane = 0.0915 x 3.25 = 0.2974 USD/gal.
  terminal_activity: python3 emi.py run 037
  expected_result: 'shrink_MMBtu_per_d: 80967.50'
  professional_application: Shrink is the gas the plant owner must make whole or account for in settlement statements.
  product_implication: Settlement and P&L need both a gallon ledger and an MMBtu ledger that reconcile.
  builds_on: L05.01.2
  leads_to: L05.01.4
- id: L05.01.4
  title: Purity vs mixed products
  prerequisite: L05.01.3
  status: written
  objective: Distinguish purity products from mixed streams.
  market_lesson: Fractionators separate mixed NGLs into purity products that are at least 90% one molecule [S3]. LPG is a mix of propane and butanes; Y-grade is the unfractionated mix leaving the gas plant [S4][S9].
  example: EX-039 values one Y-grade barrel (40% ethane by volume) at 28.05 USD at Mont Belvieu purity prices.
  terminal_activity: python3 emi.py run 039
  expected_result: 'purity_value_USD_per_barrel: 28.0518'
  professional_application: Deals are struck on either a mixed barrel or purity basis; confusing the two misprices the trade.
  product_implication: A stream entity (composition + volume) must be distinct from a product entity in the data model.
  builds_on: L05.01.3
  leads_to: L05.01.5
- id: L05.01.5
  title: Composition analysis
  prerequisite: L05.01.4
  status: written
  objective: Read a composition analysis and compute the barrel a plant will make.
  market_lesson: Barrels per day by product = inlet Mcf/d x GPM x recovery / 42. Ethane dominates volume but not value [EX].
  example: '200,000 Mcf/d plant in full recovery: 23,319 bbl/d, 48.6% of it ethane.'
  terminal_activity: python3 emi.py run 037 inlet_Mcf_per_d=300000
  expected_result: 'ngl_bbl_per_d: 34978.84 (1.5x the base 23319.23)'
  professional_application: 'Supply forecasting starts here: gas volume forecast x composition x recovery = NGL supply.'
  product_implication: Supply forecast features need gas-volume inputs linked to plant composition and recovery assumptions.
  builds_on: L05.01.4
  leads_to: L05.02.1
